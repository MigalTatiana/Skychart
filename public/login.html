<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg,rgb(12, 25, 80) 0%,rgb(54, 42, 130) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg,rgb(12, 25, 80) 0%,rgb(54, 42, 130) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.8);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: rgb(12, 25, 80);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgb(12, 25, 80) 0%, rgb(54, 42, 130) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: rgb(12, 25, 80);
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .links a:hover {
            color: rgb(54, 42, 130);
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid rgb(12, 25, 80);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .demo-credentials {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .demo-credentials h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .demo-credentials p {
            margin: 4px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Learning Platform</h1>
            <p>Sign in to your account</p>
        </div>

       

        <div id="message" class="message"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Signing in...</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required
                    value="test@example.com"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                    value="password123"
                >
            </div>

            <button type="submit" class="btn" id="submitBtn">Sign In</button>
        </form>

        <div class="links">
            <p>Don't have an account? <a href="/register.html">Sign up here</a></p>
            <p><a href="/">Back to Home</a></p>
        </div>
    </div>

    <canvas id="particles-canvas" class="particles-container"></canvas>

    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.messageDiv = document.getElementById('message');
                this.loadingDiv = document.getElementById('loading');
                this.submitBtn = document.getElementById('submitBtn');
                this.init();
            }

            init() {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                document.getElementById('email').addEventListener('input', () => this.clearMessage());
                document.getElementById('password').addEventListener('input', () => this.clearMessage());
                this.checkExistingAuth();
            }

            checkExistingAuth() {
                const token = localStorage.getItem('token');
                if (token) {
                    console.log('User already logged in, redirecting...');
                    window.location.href = '/skychart_list.html';
                }
            }

            clearMessage() {
                this.messageDiv.style.display = 'none';
            }

            showMessage(text, type) {
                this.messageDiv.textContent = text;
                this.messageDiv.className = `message ${type}`;
                this.messageDiv.style.display = 'block';
            }

            setLoading(loading) {
                this.loadingDiv.style.display = loading ? 'flex' : 'none';
                this.submitBtn.disabled = loading;
            }

            async handleLogin(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    this.showMessage('Please fill in all fields', 'error');
                    return;
                }

                this.setLoading(true);
                this.clearMessage();

                try {
                    console.log('Sending login request...');
                    
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ 
                            email: email.trim(), 
                            password: password 
                        })
                    });

                    console.log('Response status:', response.status);
                    console.log('Response headers:', Object.fromEntries(response.headers.entries()));

                    const contentType = response.headers.get('content-type');
                    let data;

                    if (contentType && contentType.includes('application/json')) {
                        data = await response.json();
                    } else {
                        const text = await response.text();
                        console.log('Non-JSON response:', text);
                        throw new Error('Server returned non-JSON response');
                    }

                    console.log('Response data:', data);

                    if (response.ok) {
                        this.showMessage(data.message || 'Login successful!', 'success');
                        if (data.token) {
                            localStorage.setItem('token', data.token);
                            console.log('Token saved to localStorage');
                        }
                        
                        if (data.user) {
                            localStorage.setItem('user', JSON.stringify(data.user));
                            console.log('User data saved:', data.user);
                        }
                        setTimeout(() => {
                            window.location.href = '/skychart_list.html';
                        }, 1000);

                    } else {
                        this.showMessage(data.error || data.message || `Login failed (${response.status})`, 'error');
                    }

                } catch (error) {
                    console.error('Login error:', error);
                    this.showMessage(
                        error.message === 'Failed to fetch' 
                            ? 'Network error. Please check your connection and try again.'
                            : `Error: ${error.message}`,
                        'error'
                    );
                } finally {
                    this.setLoading(false);
                }
            }
        }

        class ParticleAnimation {
            constructor() {
                this.canvas = document.getElementById('particles-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: 0, y: 0 };
                
                this.init();
                this.animate();
                
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
            }
            
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 3 + 1,
                        speedX: Math.random() * 1 - 0.5,
                        speedY: Math.random() * 1 - 0.5,
                        color: `rgba(255, 255, 255, ${Math.random() * 0.6 + 0.2})`
                    });
                }
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                for (let particle of this.particles) {
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.speedX *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.speedY *= -1;
                    
                    const dx = this.mouse.x - particle.x;
                    const dy = this.mouse.y - particle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        const angle = Math.atan2(dy, dx);
                        const force = (100 - distance) / 100;
                        particle.x -= Math.cos(angle) * force * 2;
                        particle.y -= Math.sin(angle) * force * 2;
                    }
                    
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fill();
                    
                    for (let otherParticle of this.particles) {
                        const dx = particle.x - otherParticle.x;
                        const dy = particle.y - otherParticle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 * (1 - distance/100)})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.moveTo(particle.x, particle.y);
                            this.ctx.lineTo(otherParticle.x, otherParticle.y);
                            this.ctx.stroke();
                        }
                    }
                }
                
                requestAnimationFrame(() => this.animate());
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new LoginManager();
            new ParticleAnimation();
            
            window.debugAuth = () => {
                console.log('Token:', localStorage.getItem('token'));
                console.log('User:', localStorage.getItem('user'));
            };
            
            console.log('Login page loaded');
            console.log('To check auth status, run: debugAuth()');
        });
    </script>
</body>
</html>
