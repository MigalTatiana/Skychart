image: node:18-alpine

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

unit-tests:
  stage: test
  services:
    - postgres:13-alpine
  variables:
    POSTGRES_DB: skychart_test
    POSTGRES_USER: gitlab
    POSTGRES_PASSWORD: password
    DATABASE_URL: "postgresql://gitlab:password@postgres:5432/skychart_test"
  script:
    - apk add --no-cache postgresql-client
    - npm ci
    - npm run test:unit
  artifacts:
    paths:
      - coverage/
    reports:
      junit: junit.xml

docker-build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      echo "Building Docker image..."
      docker build \
        --build-arg NODE_ENV=production \
        --build-arg CI_COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE:latest \
        --file Dockerfile \
        .
    - |
      echo "Pushing images to registry..."
      docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      docker push $CI_REGISTRY_IMAGE:latest
    - |
      echo "Cleaning up..."
      docker rmi $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - main
    - develop
  tags:
    - docker

deploy-staging:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - echo "$SSH_PRIVATE_KEY" > /tmp/key
    - chmod 600 /tmp/key
    - |
      ssh -o StrictHostKeyChecking=no -i /tmp/key $SERVER_USER@$SERVER_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA &&
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA skychart-app:latest &&
        docker-compose down &&
        docker-compose up -d
      "
  environment:
    name: staging
  only:
    - develop

deploy-production:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - echo "$SSH_PRIVATE_KEY" > /tmp/key
    - chmod 600 /tmp/key
    - |
      ssh -o StrictHostKeyChecking=no -i /tmp/key $PRODUCTION_USER@$PRODUCTION_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA &&
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA skychart-app:latest &&
        docker-compose down &&
        docker-compose up -d
      "
  environment:
    name: production
  only:
    - main
  when: manual